function designDetails(p){let d=detailSpecs[p];if(!d)return '';let fields=(schemas[p]||[]).map(f=>[f[0],f[1],f[2],f[3]?'必填':'選填','原型欄位']);let extras=d.extra.map(f=>[f,f.replaceAll('_',' '),'待定','待確認','建議擴充']);return `<details class="spec-detail"><summary>展開系統設計說明｜欄位、流程、規則、資料關聯與驗收 <span class="spec-arrow">▾</span></summary><div class="spec-body"><div class="spec-grid"><section><h4>操作流程</h4><p>${esc(d.flow)}</p></section><section><h4>業務規則</h4><p>${esc(d.rule)}</p></section><section><h4>資料庫關聯</h4><code>${esc(d.relation)}</code><p class="spec-hint">概念關聯，非已建置資料庫。</p></section><section><h4>驗收條件</h4><p>${esc(d.accept)}</p></section></div><h4>資料欄位定義</h4><div class="tablewrap"><table><thead><tr><th>欄位代碼</th><th>欄位名稱</th><th>資料型別</th><th>必填性</th><th>來源／狀態</th></tr></thead><tbody>${[...fields,...extras].map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="spec-hint">原型欄位依目前 HTML 表單；建議擴充欄位需在正式資料字典確認型別、約束及資料來源。</p><div class="review-row"><label for="review-${p}">需求確認狀態</label><select id="review-${p}" onchange="reviewStatus('${p}',this.value)">${[['pending','待確認'],['agreed','已確認'],['change','需修改'],['deferred','暫緩']].map(x=>`<option value="${x[0]}" ${((reviews[p]||'pending')===x[0])?'selected':''}>${x[1]}</option>`).join('')}</select><button class="btn" onclick="copySpec('${p}')">複製本模組規格</button></div></div></details>`}
function copySpec(p){let d=detailSpecs[p],m=designMap[p];let f=(schemas[p]||[]).map(x=>x[0]+'：'+x[1]).join('、');let t=[p+'｜'+d.title,'對應：'+m.ids+'；'+m.chapter,'欄位：'+f,'建議擴充：'+d.extra.join('、'),'流程：'+d.flow,'規則：'+d.rule,'資料關聯：'+d.relation,'驗收：'+d.accept,'狀態：'+(reviews[p]||'pending')].join('\n');navigator.clipboard?.writeText(t).then(()=>notice('已複製模組規格')).catch(()=>prompt('複製規格',t))}
function designStrip(p){const d=designMap[p];if(!d)return '';return `<section class="design-strip"><h3>系統設計連結｜${esc(d.ids)}</h3><div><span class="tag">${esc(d.chapter)}</span><span class="tag">${esc(d.status)}</span></div><p><b>設計目的：</b>${esc(d.desc)}</p><p><b>關聯資料實體：</b>${esc(d.entities)}</p><p><b>驗收依據：</b>${esc(d.test)}</p>${designDetails(p)}<button onclick="navigate('design')">查看全部功能與設計對照</button></section>`}
function designPage(){return `<section class="design-strip"><h3>互動式系統設計規格書｜需求追溯矩陣</h3><p>每個模組可展開欄位、操作流程、業務規則、資料關聯與驗收條件；確認狀態儲存於本機瀏覽器。</p><p><b>注意：</b>部分內容為依需求延伸的設計建議，並非已完成的後端功能或已確認的正式資料字典。</p></section>${menus.filter(m=>detailSpecs[m[0]]).map(m=>{let d=designMap[m[0]];return `<section class="panel"><div class="spec-heading"><div><h2>${esc(m[2])} <span class="tag">${esc(d.ids)}</span></h2><p class="sub">${esc(d.chapter)}｜${esc(d.status)}</p></div><button class="btn" onclick="navigate('${m[0]}')">開啟功能</button></div>${designDetails(m[0])}</section>`}).join('')}`}
function navigate(p){page=p;search='';selected.clear();render()}function render(){document.getElementById('nav').innerHTML=menus.map(m=>`<button class="nav ${page===m[0]?'active':''}" onclick="navigate('${m[0]}')"><span>${m[1]}</span> <span class="label">${m[2]}</span></button>`).join('');document.getElementById('pageTitle').textContent=menus.find(m=>m[0]===page)[2];document.getElementById('content').innerHTML=designStrip(page)+(page==='design'?designPage():page==='dashboard'?dashboard():page==='groups'?groups():page==='reports'?reports():page==='data'?dataPage():listing(page))}function dashboard(){let low=db.materials.filter(m=>+m.stock<+m.min);return `<div class="cards">${[['動物總數',db.animals.length,'已建立 Rabbit ID'],['進行中專案',db.projects.filter(x=>x.status==='進行中').length,'專案管理'],['待執行作業',db.tasks.filter(x=>x.status==='待執行').length,'預定實驗工作'],['原物料警示',low.length,'低於警戒庫存']].map(x=>`<div class="card"><div class="sub">${x[0]}</div><div class="metric">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('')}</div><div class="split"><section class="panel"><h2>近期實驗作業</h2>${simpleTable(db.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8),['animal','action','date','status'])}<button class="btn" onclick="navigate('tasks')">管理實驗作業</button></section><section class="panel"><h2>需要注意的事項</h2>${low.map(m=>`<div class="notice">物料 ${esc(m.name)}：庫存 ${m.stock} ${esc(m.unit)}，低於警戒值 ${m.min}</div>`).join('')||'<p class="muted">目前沒有庫存警示。</p>'}${db.events.filter(e=>e.status==='處理中').map(e=>`<div class="notice">${esc(e.animal)}｜${esc(e.type)}：${esc(e.description)}</div>`).join('')}</section></div><section class="panel"><h2>快速操作</h2><div class="toolbar"><button class="btn primary" onclick="openForm('animals')">新增動物</button><button class="btn" onclick="openForm('tasks')">新增實驗作業</button><button class="btn" onclick="navigate('groups')">群組批次操作</button><button class="btn" onclick="navigate('reports')">跨專案查詢</button></div></section>`}function simpleTable(rows,fields,actions=false,type=''){return `<div class="tablewrap"><table><thead><tr>${fields.map(k=>`<th>${labels[k]||k}</th>`).join('')}${actions?'<th>操作</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${fields.map(k=>`<td>${k==='status'?`<span class="tag ${['延期','停用'].includes(r[k])?'warn':''}">${esc(r[k])}</span>`:esc(r[k])}</td>`).join('')}${actions?`<td><button class="btn" onclick="openForm('${type}','${esc(r.id)}')">編輯</button> <button class="btn danger" onclick="removeItem('${type}','${esc(r.id)}')">刪除</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${fields.length+(actions?1:0)}" class="empty">沒有符合條件的資料</td></tr>`}</tbody></table></div>`}function listing(p){let rows=db[p].filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(search.toLowerCase())));return `<div class="notice">${({animals:'管理 Rabbit ID、所屬專案、群組、動物狀態及 Protocol。',projects:'以 Project 串聯 Target、Antigen 與研發工作。',protocols:'定義實驗方法與週期；此原型僅管理程序主檔，尚未實作視覺化流程編輯器。',tasks:'記錄預定作業與執行狀態，可調整日期與工作內容。',materials:'管理庫存與警戒值；本版警示依庫存門檻計算，非正式 MRP。',events:'登錄異常事件並追蹤處理狀態。',results:'記錄實驗結果與建議後續處理；流程轉換需由使用者確認執行。'})[p]}</div><section class="panel"><div class="toolbar"><input placeholder="搜尋所有欄位…" value="${esc(search)}" oninput="search=this.value;updateTable()" id="searchBox"><button class="btn primary" onclick="openForm('${p}')">＋ 新增資料</button><span class="sub">共 ${rows.length} 筆</span></div><div id="listTable">${simpleTable(rows,cols[p],true,p)}</div></section>`}function updateTable(){let rows=db[page].filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(search.toLowerCase())));document.getElementById('listTable').innerHTML=simpleTable(rows,cols[page],true,page)}function openForm(type,id){let r=id?db[type].find(x=>x.id===id):{};document.getElementById('modalTitle').textContent=(id?'編輯':'新增')+menus.find(m=>m[0]===type)[2];document.getElementById('fields').innerHTML=schemas[type].map(([key,label,kind,req,options])=>{let v=r[key]??(kind==='date'?new Date().toISOString().slice(0,10):'');let choices=kind==='animal'?db.animals.map(x=>x.id):kind==='project'?db.projects.map(x=>x.id):kind==='protocol'?db.protocols.map(x=>x.id):options;let control=choices?`<select name="${key}"><option value="">請選擇</option>${choices.map(x=>`<option ${String(x)===String(v)?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`:`<input name="${key}" type="${kind==='number'?'number':kind==='date'?'date':'text'}" ${kind==='number'?'step="any"':''} value="${esc(v)}" ${req?'required':''} ${id&&key==='id'?'readonly':''}>`;return `<div class="field"><label>${label}${req?' *':''}</label>${control}</div>`}).join('');document.getElementById('form').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());schemas[type].filter(x=>x[2]==='number').forEach(x=>obj[x[0]]=Number(obj[x[0]]||0));if(!id&&db[type].some(x=>x.id===obj.id)){notice('識別碼已存在');return}if(id){let idx=db[type].findIndex(x=>x.id===id);db[type][idx]=obj}else db[type].push(obj);save();closeModal();render();notice('資料已儲存')};document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function removeItem(type,id){if(!confirm(`確定刪除 ${id}？此操作不會同步刪除其他關聯資料。`))return;db[type]=db[type].filter(x=>x.id!==id);save();render();notice('已刪除')}function groups(){return `<div class="notice">批次選取 Rabbit ID，為多隻動物指定群組、Protocol 或建立相同作業。批次操作不會覆寫既有作業紀錄。</div><div class="split"><section class="panel"><h2>選取動物 <span class="sub" id="selectedCount">（已選 ${selected.size} 隻）</span></h2><div class="toolbar"><input id="animalFilter" placeholder="輸入 Rabbit ID、Project 或群組" oninput="drawAnimals()"><button class="btn" onclick="selectAllFiltered()">選取篩選結果</button><button class="btn" onclick="selected.clear();drawAnimals()">清除選取</button></div><div id="animalChoices"></div></section><section class="panel"><h2>批次執行</h2><div class="field"><label>操作類型</label><select id="bulkType" onchange="bulkFields()"><option value="group">指定群組</option><option value="protocol">變更 Protocol</option><option value="task">新增實驗作業</option></select></div><div id="bulkFields" style="margin-top:15px"></div><div class="actions"><button class="btn primary" onclick="applyBulk()">套用至已選動物</button></div><p class="sub">異動將立即寫入此瀏覽器的示範資料；正式版本應加入權限及審核機制。</p></section></div>`}function drawAnimals(){let term=(document.getElementById('animalFilter')?.value||'').toLowerCase();let rows=db.animals.filter(a=>[a.id,a.project,a.group].join(' ').toLowerCase().includes(term));document.getElementById('animalChoices').innerHTML=`<div class="tablewrap"><table><thead><tr><th>選取</th><th>Rabbit ID</th><th>專案</th><th>群組</th><th>Protocol</th></tr></thead><tbody>${rows.map(a=>`<tr><td><input type="checkbox" ${selected.has(a.id)?'checked':''} onchange="toggleAnimal('${esc(a.id)}',this.checked)"></td><td>${esc(a.id)}</td><td>${esc(a.project)}</td><td>${esc(a.group)}</td><td>${esc(a.protocol)}</td></tr>`).join('')}</tbody></table></div>`;document.getElementById('selectedCount').textContent=`（已選 ${selected.size} 隻）`}function toggleAnimal(id,v){v?selected.add(id):selected.delete(id);document.getElementById('selectedCount').textContent=`（已選 ${selected.size} 隻）`}function selectAllFiltered(){let term=(document.getElementById('animalFilter')?.value||'').toLowerCase();db.animals.filter(a=>[a.id,a.project,a.group].join(' ').toLowerCase().includes(term)).forEach(a=>selected.add(a.id));drawAnimals()}function bulkFields(){let t=document.getElementById('bulkType').value;document.getElementById('bulkFields').innerHTML=t==='group'?'<div class="field"><label>群組 ID</label><input id="bulkValue" placeholder="例如 G-C"></div>':t==='protocol'?`<div class="field"><label>指定 Protocol</label><select id="bulkValue">${db.protocols.map(p=>`<option value="${esc(p.id)}">${esc(p.id)} · ${esc(p.name)}</option>`).join('')}</select></div>`:'<div class="gridform"><div class="field wide"><label>作業名稱</label><input id="bulkValue" placeholder="例如 採血"></div><div class="field"><label>執行日期</label><input id="bulkDate" type="date" value="2026-11-15"></div></div>'}function applyBulk(){if(!selected.size)return notice('請先選取動物');let t=document.getElementById('bulkType').value,v=document.getElementById('bulkValue').value.trim();if(!v)return notice('請輸入操作內容');if(t==='task'){let date=document.getElementById('bulkDate').value;if(!date)return notice('請選擇日期');[...selected].forEach(id=>{let a=db.animals.find(x=>x.id===id);db.tasks.push({id:'TSK-'+crypto.randomUUID().slice(0,8).toUpperCase(),animal:id,action:v,date,status:'待執行',protocol:a.protocol})})}else db.animals.forEach(a=>{if(selected.has(a.id))a[t]=v});save();render();notice(`已完成 ${selected.size} 隻動物的批次操作`)}function reports(){let projects=db.projects.map(p=>({...p,animals:db.animals.filter(a=>a.project===p.id),tasks:db.tasks.filter(t=>db.animals.some(a=>a.id===t.animal&&a.project===p.id))}));return `<div class="cards">${[['動物數',db.animals.length],['實驗作業',db.tasks.length],['實驗結果',db.results.length],['異常事件',db.events.length]].map(x=>`<div class="card"><div class="sub">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><section class="panel"><h2>專案彙整</h2>${simpleTable(projects.map(p=>({id:p.id,name:p.name,target:p.target,animals:p.animals.length,tasks:p.tasks.length,due:p.due})),['id','name','target','animals','tasks','due'])}</section><section class="panel"><h2>動物完整歷程查詢</h2><div class="toolbar"><select id="historyAnimal" onchange="drawHistory()">${db.animals.map(a=>`<option value="${esc(a.id)}">${esc(a.id)}</option>`).join('')}</select><button class="btn" onclick="exportHistory()">匯出動物歷程 CSV</button></div><div id="history"></div></section>`}function drawHistory(){let id=document.getElementById('historyAnimal').value;let rows=[...db.tasks.filter(x=>x.animal===id).map(x=>({date:x.date,type:'實驗作業',detail:x.action,status:x.status})),...db.events.filter(x=>x.animal===id).map(x=>({date:x.date,type:'異常事件',detail:x.description,status:x.status})),...db.results.filter(x=>x.animal===id).map(x=>({date:x.date,type:'實驗結果',detail:x.result,status:x.next}))].sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('history').innerHTML=simpleTable(rows,['date','type','detail','status'])}function csv(rows,fields){let quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';return '\ufeff'+[fields.join(','),...rows.map(r=>fields.map(k=>quote(r[k])).join(','))].join('\r\n')}function download(name,data,mime){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type:mime}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportHistory(){let id=document.getElementById('historyAnimal').value;let rows=[...db.tasks.filter(x=>x.animal===id).map(x=>({date:x.date,type:'作業',detail:x.action,status:x.status})),...db.events.filter(x=>x.animal===id).map(x=>({date:x.date,type:'異常',detail:x.description,status:x.status})),...db.results.filter(x=>x.animal===id).map(x=>({date:x.date,type:'結果',detail:x.result,status:x.next}))];download(id+'_history.csv',csv(rows,['date','type','detail','status']),'text/csv;charset=utf-8')}function dataPage(){return `<section class="panel"><h2>資料交換與備份</h2><div class="notice">支援整套示範資料 JSON 匯入／匯出，以及單一資料表 CSV 匯出。JSON 匯入會取代目前瀏覽器內的資料，請先備份。</div><div class="toolbar"><button class="btn primary" onclick="download('arapms-backup.json',JSON.stringify(db,null,2),'application/json')">匯出完整 JSON 備份</button><button class="btn" onclick="document.getElementById('importFile').click()">匯入 JSON 備份</button><button class="btn danger" onclick="resetDemo()">還原示範資料</button></div><h2 style="margin-top:30px">CSV 資料匯出</h2><div class="toolbar"><select id="exportType">${Object.keys(schemas).map(k=>`<option value="${k}">${menus.find(m=>m[0]===k)[2]}</option>`).join('')}</select><button class="btn" onclick="exportCSV()">匯出 CSV</button></div><p class="sub">本原型尚未提供 CSV 匯入欄位對應、資料驗證與衝突合併；可使用 JSON 備份恢復完整資料。</p></section><section class="panel"><h2>原型與正式系統的差異</h2><p>本機版提供互動介面與資料操作，但尚未實作伺服器、登入驗證、多人同步、稽核軌跡、庫存扣帳、Protocol 規則引擎與自動重新計算後續日期。這些均需後端服務及正式資料庫支援。</p></section>`}function exportCSV(){let t=document.getElementById('exportType').value;download(t+'.csv',csv(db[t],schemas[t].map(x=>x[0])),'text/csv;charset=utf-8')}function resetDemo(){if(confirm('確定還原示範資料？目前修改將被清除。')){db=structuredClone(seed);save();render();notice('已還原')}}document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Object.keys(seed).every(k=>Array.isArray(d[k])))throw Error('缺少必要資料表');if(!confirm('將取代目前所有示範資料，確定繼續？'))return;db=d;save();render();notice('已匯入備份')}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});const originalRender=render;render=function(){originalRender();if(page==='groups'){drawAnimals();bulkFields()}if(page==='reports'&&db.animals.length)drawHistory()};render();
</script></body></html>
